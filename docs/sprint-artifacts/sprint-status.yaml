# Sprint Status Tracking
# This file tracks the development status of all epics.
#
# Status Definitions:
#   - backlog: The epic has been defined but no technical specification has been created.
#   - contexted: The technical specification for the epic has been generated.
#   - in_progress: Development has started on one or more stories within the epic.
#   - completed: All stories within the epic are complete and the epic is done.

