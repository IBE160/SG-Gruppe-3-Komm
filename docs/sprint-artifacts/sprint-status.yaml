# Sprint Status Tracking
# This file tracks the development status of all epics and stories.
#
# Status Definitions:
#   - backlog: The epic/story has been defined but no technical specification/context has been created.
#   - contexted: The technical specification/context for the epic/story has been generated.
#   - in_progress: Development has started on one or more stories within the epic, or the story is ready for dev.
#   - completed: All stories within the epic are complete and the epic is done, or the story is done.

